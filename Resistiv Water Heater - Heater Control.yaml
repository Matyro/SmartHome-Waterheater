alias: Resistiv Water Heater - Heater Control
description: >-
  Switch phases 1-3. Phases 1 and 2 run for Party Mode (below 55°C) or for heat
  demand with 2 minutes of sufficient surplus (>1200 W / >2300 W); phase 3 runs
  for Party Mode only. Party Mode is cleared at 55°C or higher.
triggers:
  - trigger: power.changed
    target:
      entity_id: sensor.inverter_active_power
    options:
      threshold:
        type: any
  - trigger: state
    entity_id:
      - input_boolean.water_heater_needs_heat
      - input_boolean.water_heater_party_mode
      - input_boolean.water_heater_fault
      - binary_sensor.keller_heizung_kessel_ntc_fault
      - binary_sensor.keller_heizung_heizstab_ntc_fault
      - sensor.keller_heizung_kessel_ntc
  - trigger: time_pattern
    minutes: /1
  - trigger: homeassistant
    event: start
actions:
  - alias: Clear Party Mode at 55°C or higher
    if:
      - condition: numeric_state
        entity_id: sensor.keller_heizung_kessel_ntc
        above: 54.999
    then:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.water_heater_party_mode
  - alias: Phase 3 (Party Mode only)
    if:
      - condition: numeric_state
        entity_id: sensor.keller_heizung_kessel_ntc
        below: 55
      - condition: state
        entity_id: input_boolean.water_heater_party_mode
        state: 'on'
      - condition: state
        entity_id: input_boolean.water_heater_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_kessel_ntc_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_heizstab_ntc_fault
        state: 'off'
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.controllino_maxi_heater_phase_3
    else:
      - action: switch.turn_off
        target:
          entity_id: switch.controllino_maxi_heater_phase_3
  - alias: Phase 1
    if:
      - condition: numeric_state
        entity_id: sensor.keller_heizung_kessel_ntc
        below: 65
      - condition: state
        entity_id: input_boolean.water_heater_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_kessel_ntc_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_heizstab_ntc_fault
        state: 'off'
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.keller_heizung_kessel_ntc
                below: 55
              - condition: state
                entity_id: input_boolean.water_heater_party_mode
                state: 'on'
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.water_heater_needs_heat
                state: 'on'
              - condition: power.is_value
                target:
                  entity_id: sensor.inverter_active_power
                options:
                  threshold:
                    type: above
                    value:
                      active_choice: number
                      number: 1200
                      unit_of_measurement: W
                  for:
                    hours: 0
                    minutes: 2
                    seconds: 0
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.controllino_maxi_heater_phase_1
    else:
      - action: switch.turn_off
        target:
          entity_id: switch.controllino_maxi_heater_phase_1
  - alias: Phase 2
    if:
      - condition: numeric_state
        entity_id: sensor.keller_heizung_kessel_ntc
        below: 65
      - condition: state
        entity_id: input_boolean.water_heater_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_kessel_ntc_fault
        state: 'off'
      - condition: state
        entity_id: binary_sensor.keller_heizung_heizstab_ntc_fault
        state: 'off'
      - condition: or
        conditions:
          - condition: and
            conditions:
              - condition: numeric_state
                entity_id: sensor.keller_heizung_kessel_ntc
                below: 55
              - condition: state
                entity_id: input_boolean.water_heater_party_mode
                state: 'on'
          - condition: and
            conditions:
              - condition: state
                entity_id: input_boolean.water_heater_needs_heat
                state: 'on'
              - condition: power.is_value
                target:
                  entity_id: sensor.inverter_active_power
                options:
                  threshold:
                    type: above
                    value:
                      active_choice: number
                      number: 2300
                      unit_of_measurement: W
                  for:
                    hours: 0
                    minutes: 2
                    seconds: 0
    then:
      - action: switch.turn_on
        target:
          entity_id: switch.controllino_maxi_heater_phase_2
    else:
      - action: switch.turn_off
        target:
          entity_id: switch.controllino_maxi_heater_phase_2
mode: queued
max: 10
