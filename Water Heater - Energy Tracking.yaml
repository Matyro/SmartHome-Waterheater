alias: Water Heater - Energy Tracking
description: >-
  Estimate energy (1 kW per active phase, every minute) and reset the total at
  00:01 unless a fault is latched.
triggers:
  - trigger: time_pattern
    minutes: /1
    id: tick
  - trigger: time
    at: '00:01:00'
    id: reset
variables:
  active_phases: >-
    {{ expand('switch.controllino_maxi_heater_phase_1',
              'switch.controllino_maxi_heater_phase_2',
              'switch.controllino_maxi_heater_phase_3')
       | selectattr('state', 'eq', 'on') | list | count }}
actions:
  - choose:
      - alias: Daily reset
        conditions:
          - condition: trigger
            id: reset
          - condition: state
            entity_id: input_boolean.water_heater_fault
            state: 'off'
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.water_heater_cycle_energy_kwh
            data:
              value: 0
      - alias: Add one minute of active phases
        conditions:
          - condition: trigger
            id: tick
          - condition: template
            value_template: "{{ active_phases > 0 }}"
        sequence:
          - action: input_number.set_value
            target:
              entity_id: input_number.water_heater_cycle_energy_kwh
            data:
              value: >-
                {{ states('input_number.water_heater_cycle_energy_kwh') | float(0)
                   + active_phases / 60 }}
mode: queued
max: 3
