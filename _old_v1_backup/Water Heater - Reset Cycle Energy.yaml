alias: Water Heater - Reset Cycle Energy
description: Reset the daily estimated energy total at 00:01 unless a fault is latched.
triggers:
  - trigger: time
    at: '00:01:00'
conditions:
  - condition: state
    entity_id: input_boolean.water_heater_fault
    state: 'off'
actions:
  - action: input_number.set_value
    target:
      entity_id: input_number.water_heater_cycle_energy_kwh
    data:
      value: 0
mode: single
