alias: Heater Turn Off (65°C Reached)
description: Latch the safety fault when the tank temperature exceeds 65°C.
triggers:
  - trigger: temperature.crossed_threshold
    target:
      entity_id: sensor.keller_heizung_kessel_ntc
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 65
          unit_of_measurement: °C
      for:
        hours: 0
        minutes: 0
        seconds: 0
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: "{{ is_number(states('sensor.keller_heizung_kessel_ntc')) }}"
  - condition: temperature.is_value
    target:
      entity_id: sensor.keller_heizung_kessel_ntc
    options:
      threshold:
        type: above
        value:
          active_choice: number
          number: 65
          unit_of_measurement: °C
actions:
  - action: switch.turn_off
    target:
      entity_id:
        - switch.controllino_maxi_heater_phase_1
        - switch.controllino_maxi_heater_phase_2
        - switch.controllino_maxi_heater_phase_3
  - action: input_boolean.turn_on
    metadata: {}
    target:
      entity_id: input_boolean.water_heater_fault
    data: {}
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.water_heater_party_mode
mode: single
