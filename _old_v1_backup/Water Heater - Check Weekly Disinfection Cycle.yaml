alias: Water Heater - Check Weekly Disinfection Cycle
description: Request a disinfection cycle when at least seven days have passed.
triggers:
  - trigger: time
    at: '05:00:00'
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: >
      {{ as_timestamp(states('input_datetime.water_heater_last_legionella_cycle'), default=0)
         <= as_timestamp(now()) - (7 * 24 * 60 * 60) }}
actions:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ is_number(states('sensor.keller_heizung_kessel_ntc')) }}"
          - condition: temperature.is_value
            target:
              entity_id: sensor.keller_heizung_kessel_ntc
            options:
              threshold:
                type: above
                value:
                  active_choice: number
                  number: 62
                  unit_of_measurement: °C
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.water_heater_needs_heat
          - action: input_datetime.set_datetime
            target:
              entity_id: input_datetime.water_heater_last_legionella_cycle
            data:
              timestamp: '{{ now().timestamp() }}'
    default:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.water_heater_needs_heat
mode: single
