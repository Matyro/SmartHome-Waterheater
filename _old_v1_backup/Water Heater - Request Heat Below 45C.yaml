alias: Water Heater - Request Heat Below 45°C
description: Request heat when the tank temperature falls below 45°C.
triggers:
  - trigger: state
    entity_id: sensor.keller_heizung_kessel_ntc
  - trigger: homeassistant
    event: start
conditions:
  - condition: template
    value_template: "{{ is_number(states('sensor.keller_heizung_kessel_ntc')) }}"
  - condition: temperature.is_value
    target:
      entity_id: sensor.keller_heizung_kessel_ntc
    options:
      threshold:
        type: below
        value:
          active_choice: number
          number: 45
          unit_of_measurement: °C
actions:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.water_heater_needs_heat
mode: single