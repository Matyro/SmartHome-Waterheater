alias: Water Heater - Reset Party Mode Above 55°C
description: Turn Party Mode off and stop all phases when the tank reaches 55°C.
triggers:
  - trigger: state
    entity_id: sensor.keller_heizung_kessel_ntc
  - trigger: state
    entity_id: input_boolean.water_heater_party_mode
    to: 'on'
  - trigger: homeassistant
    event: start
conditions:
  - condition: state
    entity_id: input_boolean.water_heater_party_mode
    state: 'on'
  - condition: template
    value_template: >-
      {{ is_number(states('sensor.keller_heizung_kessel_ntc'))
         and states('sensor.keller_heizung_kessel_ntc') | float >= 55 }}
actions:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.water_heater_party_mode
mode: single